[project]
name = "technews"
version = "0.1.0"
description = "Turn the day's tech news into animated vertical shorts (script, AI voice, motion graphics) for YouTube Shorts and TikTok."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # core / cli
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    # news
    "feedparser>=6.0.11",
    "trafilatura>=2.0",
    "rapidfuzz>=3.9",
    # voice
    "kokoro-onnx>=0.6.1",
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.60",
    "openai>=1.99",
    "google-genai>=1.30",
]
publish = [
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
technews = "technews.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/technews"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "UP046", "UP047", "SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: downloads models or renders video",
    "network: needs internet access",
]
