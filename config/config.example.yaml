# Tech News Shorts settings. `technews init` copies this to config/config.yaml (which git ignores).
# Anything left out uses the defaults in src/technews/config.py.

brand:
  name: Byte Brief                 # shown in the title block and on the closing sheet
  outro_text: Follow for tomorrow's brief
  theme: {}                        # colour overrides: bg, bgDeep, line, draft, accent, alert, ink

news:
  max_age_hours: 36
  fetch_article: true              # read the full article page (much better scripts than the feed summary)
  repeat_window_days: 14           # don't cover the same story twice within this window
  hacker_news:
    enabled: true
    min_points: 150
  feeds:
    - {name: The Verge, url: "https://www.theverge.com/rss/index.xml"}
    - {name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index"}
    - {name: TechCrunch, url: "https://techcrunch.com/feed/"}
    - {name: Engadget, url: "https://www.engadget.com/rss.xml"}
    - {name: Wired, url: "https://www.wired.com/feed/rss", weight: 0.9}
    - {name: 9to5Mac, url: "https://9to5mac.com/feed/", weight: 0.8}
    - {name: 9to5Google, url: "https://9to5google.com/feed/", weight: 0.8}

llm:
  tasks:
    # Who writes the script. Examples:
    #   {provider: ollama, model: "qwen3:14b"}      local, free (ollama pull qwen3:14b)
    #   {provider: anthropic, model: claude-opus-5-5} needs ANTHROPIC_API_KEY and `uv sync --extra llm`
    #   {provider: "null"}                          no AI: template script from the article's first sentences
    script: {provider: ollama, model: "qwen3:14b", temperature: 0.6}
  budget_usd_per_video: 0.50       # cloud providers only

script:
  min_words: 80
  max_words: 135
  max_scenes: 6
  style: "Upbeat and clear. Explain jargon in plain words. No hype words like 'insane' or 'game-changer'."
  verify_numbers: true             # stat graphics must use numbers that appear in the article

voice:
  voice: af_heart                  # `technews voices` lists them; `technews say "text"` to audition
  speed: 1.15
  pronunciations: {}               # extra words the voice gets wrong, e.g. {Asus: ay-soos}

render:
  crf: 23                          # lower = bigger file, higher quality
  concurrency: null                # e.g. "8" or "50%"
  gl: null                         # "angle" can speed up renders on Windows
  captions: {enabled: true, max_words: 3, max_chars: 16}
  sfx: true
  music_dir: assets/music          # drop tracks you have the rights to here; one is picked per video
  music_volume: 0.07

publish:
  export_dir: out/exports          # point this at a OneDrive/Google Drive folder to get videos on your phone
  targets:
    - {platform: export}
    - {platform: youtube, enabled: false, account: main, privacy: private}
    - {platform: tiktok, enabled: false, account: main, mode: inbox_draft}
  youtube_synthetic_media: false
  tiktok_ai_label: true
